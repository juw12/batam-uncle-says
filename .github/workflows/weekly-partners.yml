name: Weekly driver check and search pages

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC (09:00 Singapore / 08:00 Batam)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - partners.json
      - data.js
      - photos.js
      - tools/**
      - .github/workflows/weekly-partners.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check listed drivers and candidates
        run: python tools/partners_check.py
      - name: Rebuild partners.js, driver and ferry pages
        run: python tools/partners_build.py
      - name: Rebuild search pages, sitemap and llms.txt
        run: python tools/seo_build.py
      - name: Commit changes
        run: |
          git config user.name "batam-uncle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly driver check $(date -u +%F)"
            git push
          fi
      - name: Tell search engines (IndexNow)
        run: python tools/indexnow.py
