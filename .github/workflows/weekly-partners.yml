name: Weekly driver check and search pages

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC (09:00 Singapore / 08:00 Batam)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check listed drivers and candidates
        run: python tools/partners_check.py
      - name: Rebuild partners.js, search pages and sitemap
        run: python tools/partners_build.py
      - name: Commit changes
        run: |
          git config user.name "batam-uncle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly driver check $(date -u +%F)"
            git push
          fi
      - name: Tell search engines (IndexNow)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"juw12.github.io","key":"${{ vars.INDEXNOW_KEY || 'b7c4e1f09a3d4c6e8f2a5b1d7e9c3f60' }}","keyLocation":"https://juw12.github.io/batam-uncle-says/b7c4e1f09a3d4c6e8f2a5b1d7e9c3f60.txt","urlList":["https://juw12.github.io/batam-uncle-says/","https://juw12.github.io/batam-uncle-says/driver-prices/","https://juw12.github.io/batam-uncle-says/ferry/"]}' \
            -w "IndexNow HTTP %{http_code}\n" || true
