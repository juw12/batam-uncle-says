name: Daily events check

on:
  schedule:
    - cron: "0 23 * * *"   # every day 23:00 UTC (07:00 Singapore / 06:00 Batam)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh what's on in Batam (batam.co.id, keeps old data if the page looks wrong)
        run: python tools/events_refresh.py
      - name: Commit changes
        run: |
          git config user.name "batam-uncle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily events check $(date -u +%F)"
            git pull --rebase
            git push
          fi
