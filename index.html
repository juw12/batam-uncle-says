<title>Batam Uncle Says</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #5f6b7c;
    --line: #e4e7ec;
    --line-strong: #cbd2dc;
    --accent: #0b3b5c;
    --accent-hover: #082d47;
    --accent-soft: #e7eff6;
    --deep: #0b2a40;
    --sand: #f6efe4;
    --sand-ink: #7a4a12;
    --ok: #047857;
    --ok-soft: #ecfdf5;
    --warn: #9a4508;
    --warn-soft: #fff6eb;
    --bad: #b91c1c;
    --bad-soft: #fef2f2;
    --radius: 16px;
    --display: "Instrument Serif", Georgia, "Times New Roman", serif;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.05);
  }
  @font-face { font-family: "Inter"; src: url("fonts/inter-latin.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif-latin.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif-latin-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ico.sm { width: 16px; height: 16px; }
  .ico.xs { width: 14px; height: 14px; }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); }
  .brand:hover { text-decoration: none; }
  .mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--deep);
    display: grid;
    place-items: center;
    flex: none;
  }
  .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.015em; white-space: nowrap; }
  .brand-sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topnav { display: none; gap: 2px; margin-left: auto; }
  .topnav a {
    padding: 7px 11px;
    border-radius: 8px;
    color: var(--ink-2);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
  }
  .topnav a:hover { background: var(--bg); text-decoration: none; }
  .topnav a.active { color: var(--accent); background: var(--accent-soft); }
  .lang {
    margin-left: auto;
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 2px;
    flex: none;
  }
  .lang button {
    border: 0;
    background: transparent;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-2);
    border-radius: 7px;
    cursor: pointer;
  }
  .lang button.on { background: var(--accent); color: #fff; }

  main { max-width: 1080px; margin: 0 auto; padding: 4px 16px 112px; }
  section { display: none; }
  section.active { display: block; animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .narrow { max-width: 720px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 6px; }
  h1 { font-family: var(--display); font-size: 36px; line-height: 1.05; font-weight: 400; letter-spacing: -0.01em; margin: 0 0 10px; }
  h1 em, .home-hero h1 em { font-style: italic; }
  html[lang^=zh] h1 { font-family: inherit; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
  .lede { color: var(--ink-2); margin: 0 0 20px; font-size: 15px; max-width: 620px; }
  h2 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 30px 0 12px; }
  .h2row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
  .h2row h2 { margin: 0; }
  .h2row a { font-size: 14px; font-weight: 500; white-space: nowrap; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  label, .label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
  select, input[type=number], input[type=time] {
    width: 100%;
    height: 46px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 15px;
    min-width: 0;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .toggle {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 14px;
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
  }
  .toggle:hover { border-color: var(--ink-3); }
  .toggle[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .toggle .count { opacity: 0.75; font-size: 12.5px; margin-left: 4px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 46px;
    padding: 0 18px;
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent-hover); text-decoration: none; }
  .btn.block { display: flex; width: 100%; margin-top: 18px; }
  .btn.ghost { background: var(--surface); color: var(--accent); border-color: var(--line-strong); }
  .btn.ghost:hover { background: var(--accent-soft); }
  .btn.light { background: #fff; color: var(--deep); border-color: #fff; }
  .btn.light:hover { background: #eef3f7; }
  .btn.outline-light { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.6); }
  .btn.outline-light:hover { background: rgba(255, 255, 255, 0.12); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--warn-soft);
    color: var(--warn);
    white-space: nowrap;
    vertical-align: 1px;
  }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
    padding: 5px 8px;
    border-radius: 6px;
    background: var(--ok-soft);
    color: var(--ok);
    white-space: nowrap;
  }
  .small { font-size: 13.5px; color: var(--ink-2); }
  .meta { font-size: 13px; color: var(--ink-3); }
  .links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .links a { font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }

  /* Uncle says note */
  .uncle {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--sand);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 0 0 12px;
    color: #3d2a12;
    font-size: 14px;
  }
  .uncle .badge {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--sand-ink);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: -0.02em;
  }
  .uncle b { display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sand-ink); margin-bottom: 2px; }
  .uncle a { color: var(--sand-ink); font-weight: 500; }

  /* ---------- home ---------- */
  .home-hero {
    position: relative;
    margin: 0 -16px;
    min-height: 460px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    background: var(--deep);
    color: #fff;
  }
  .home-hero > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .home-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8, 26, 40, 0.15) 0%, rgba(8, 26, 40, 0.55) 45%, rgba(8, 26, 40, 0.94) 100%);
  }
  .home-hero .inner { position: relative; z-index: 1; padding: 28px 20px 22px; width: 100%; }
  .home-hero .kicker { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #dbe7f0; margin-bottom: 10px; }
  .home-hero h1 { color: #fff; font-size: 46px; line-height: 0.98; letter-spacing: -0.015em; margin-bottom: 12px; max-width: 600px; }
  html[lang^=zh] .home-hero h1 { font-size: 32px; line-height: 1.2; }
  .home-hero p { margin: 0 0 20px; color: #e6eef4; max-width: 520px; font-size: 15.5px; }
  .home-hero .ctas { display: flex; flex-wrap: wrap; gap: 10px; }
  .home-hero .credit { position: relative; z-index: 1; margin-top: 16px; font-size: 11.5px; color: #c9d6e0; }
  .home-hero .credit a { color: #c9d6e0; text-decoration: underline; }

  .facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin: 18px 0 0;
    box-shadow: var(--shadow);
  }
  .fact { background: var(--surface); padding: 14px 16px; min-width: 0; }
  .fact .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .fact .k { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .fact .s { font-size: 12px; color: var(--ink-3); }

  .tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tool {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: border-color 0.15s, transform 0.15s;
    min-width: 0;
  }
  .tool:hover { text-decoration: none; border-color: var(--line-strong); transform: translateY(-1px); }
  .tool .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .tool b { font-size: 15px; font-weight: 650; }
  .tool span { font-size: 13px; color: var(--ink-2); line-height: 1.4; }

  .bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bcard {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 168px;
    border-radius: var(--radius);
    overflow: hidden;
    color: #fff;
    background: var(--deep);
    isolation: isolate;
  }
  .bcard:hover { text-decoration: none; }
  .bcard.big { grid-column: 1 / -1; min-height: 210px; }
  .bcard > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 0.4s ease; }
  .bcard:hover > img { transform: scale(1.03); }
  .bcard::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8, 26, 40, 0) 25%, rgba(8, 26, 40, 0.86) 100%); }
  .bcard .txt { padding: 14px 16px 16px; }
  .bcard b { display: block; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
  .bcard.big b { font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: 0; line-height: 1.05; }
  html[lang^=zh] .bcard.big b { font-family: inherit; font-weight: 700; font-size: 22px; }
  .bcard span { display: block; font-size: 13px; color: #dce6ee; margin-top: 3px; line-height: 1.35; }
  .bcard .go { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.94); color: var(--deep); display: grid; place-items: center; }
  .bcard .go .ico { transform: rotate(-45deg); }
  .bcard.solid { background: linear-gradient(150deg, #0e4a6e, #0b2a40); min-height: 0; }
  .bcard.solid::after { display: none; }
  .bcard.solid .txt { padding-top: 56px; }
  .rows { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .rows a, .rows button.row-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
  .rows > :last-child { border-bottom: 0; }
  .rows a:hover, .rows button.row-btn:hover { background: var(--bg); text-decoration: none; }
  .rows .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .rows .tx { flex: 1; min-width: 0; }
  .rows .tx b { display: block; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .rows .tx span { display: block; font-size: 13px; color: var(--ink-2); }
  .rows .chev { color: var(--ink-3); flex: none; }
  .bento-credit { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-3); margin: 2px 2px 0; }
  .bento-credit a { color: var(--ink-3); text-decoration: underline; }
  @media (min-width: 720px) {
    .bento { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .bcard.big { grid-column: span 2; grid-row: span 2; min-height: 360px; }
    .bcard.big b { font-size: 40px; }
    .bento .rows { grid-column: span 2; }
  }
  .row-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: #fff; background: linear-gradient(160deg, var(--tile-a), var(--tile-b)); }
  .more-places { margin-top: 26px; }
  .more-places h2 { margin: 0 0 4px; }
  .more-places .lede-sm { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-2); }
  @media (min-width: 720px) {
    .more-places .rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .more-places .rows > * { border-right: 1px solid var(--line); }
  }

  .rail-scroll {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 72%;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-padding-inline: 16px;
    align-items: stretch;
    margin: 0 -16px;
    padding: 2px 16px 10px;
    scrollbar-width: none;
  }
  .rail-scroll::-webkit-scrollbar { display: none; }
  .rail-scroll > * { scroll-snap-align: start; }

  .trust { display: grid; gap: 12px; }
  .trust-item { display: flex; gap: 12px; align-items: flex-start; }
  .trust-item .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .trust-item b { display: block; font-size: 14.5px; }
  .trust-item p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .meter { height: 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; margin: 8px 0 6px; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; min-width: 0; }

  /* ---------- place cards ---------- */
  .pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .pcard {
    display: flex;
    flex-direction: column;
    text-align: left;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: border-color 0.15s, transform 0.15s;
    min-width: 0;
  }
  .pcard:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .pcard .media { aspect-ratio: 4 / 3; width: 100%; height: auto; flex: none; }
  .pcard .body { padding: 10px 12px 12px; min-width: 0; flex: 1; }
  .pcard .cat { font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
  .pcard .name { font-size: 14.5px; font-weight: 650; line-height: 1.3; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .pcard .area { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
  .media { display: block; object-fit: cover; background: var(--line); }
  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
    overflow: hidden;
    color: #fff;
    background-image:
      repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 9px),
      linear-gradient(160deg, var(--tile-a), var(--tile-b));
    background-color: var(--tile-b);
  }
  .tile .tile-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tile .tile-ic { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, 0.16); display: grid; place-items: center; flex: none; }
  .tile .tile-ic .ico { width: 16px; height: 16px; stroke-width: 1.7; }
  .tile .tile-chip { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: rgba(0, 0, 0, 0.28); color: #fff; white-space: nowrap; }
  .tile .tile-area { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; overflow-wrap: anywhere; }
  .tile .tile-cat { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.85); margin-bottom: 3px; }
  .tile-eat { --tile-a: #9a4d1c; --tile-b: #6e3310; }
  .tile-spa { --tile-a: #2a7458; --tile-b: #17503b; }
  .tile-shop { --tile-a: #335591; --tile-b: #1f3a6b; }
  .tile-play { --tile-a: #7a6418; --tile-b: #54430c; }
  .tile-stay { --tile-a: #5b4b94; --tile-b: #3b2f6c; }
  .sheet .tile .tile-area { font-size: 28px; }
  .sheet .tile { padding: 18px; }

  .filters { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
  .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .seg::-webkit-scrollbar { display: none; }
  .result-count { font-size: 13px; color: var(--ink-3); margin: 0 0 10px; }

  /* ---------- sheet (dialog) ---------- */
  dialog.sheet {
    border: 0;
    padding: 0;
    margin: auto auto 0;
    width: 100%;
    max-width: 100%;
    max-height: 92vh;
    border-radius: 18px 18px 0 0;
    background: var(--surface);
    color: var(--ink);
    overflow: auto;
    box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.2);
  }
  dialog.sheet::backdrop { background: rgba(10, 20, 32, 0.5); }
  dialog.sheet[open] { animation: up 0.2s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .media { width: 100%; aspect-ratio: 16 / 9; }
  .sheet .content { padding: 18px 20px 24px; }
  .sheet h3 { font-size: 22px; letter-spacing: -0.02em; margin: 4px 0 6px; line-height: 1.2; }
  .sheet .close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, 0.95);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    z-index: 2;
  }
  .sheet .wrap { position: relative; }
  .sheet .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .sheet .status { display: flex; gap: 10px; align-items: flex-start; background: var(--bg); border-radius: var(--radius-sm); padding: 12px; margin-top: 14px; font-size: 13.5px; color: var(--ink-2); }
  .sheet .credit-line { font-size: 12px; color: var(--ink-3); margin-top: 10px; }
  .sheet .credit-line a { color: var(--ink-3); text-decoration: underline; }
  .more-list { list-style: none; margin: 0; padding: 8px 12px 20px; }
  .more-list a { display: flex; align-items: center; gap: 14px; padding: 14px 8px; border-bottom: 1px solid var(--line); color: var(--ink); }
  .more-list li:last-child a { border-bottom: 0; }
  .more-list a:hover { text-decoration: none; background: var(--bg); }
  .more-list .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .more-list b { display: block; font-size: 15px; }
  .more-list span { font-size: 13px; color: var(--ink-2); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 4px; }
  .sheet-head b { font-size: 17px; }
  .sheet-head .close { position: static; box-shadow: none; background: var(--bg); }

  /* ---------- plan ---------- */
  .plan-layout { display: grid; gap: 16px; align-items: start; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 50px 16px 1fr; column-gap: 10px; }
  .timeline .time { font-weight: 650; font-size: 14px; padding-top: 1px; }
  .rail { position: relative; }
  .rail::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .timeline li:first-child .rail::before { top: 8px; }
  .timeline li:last-child .rail::before { bottom: calc(100% - 8px); }
  .rail::after {
    content: "";
    position: absolute;
    left: 3px;
    top: 5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--accent);
  }
  .timeline li.key .rail::after { background: var(--accent); }
  .timeline .body { padding-bottom: 18px; min-width: 0; }
  .timeline .title { font-weight: 600; font-size: 15px; }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; text-align: left; font-size: 13.5px; }
  .linkbtn:hover { text-decoration: underline; }
  .with-thumb { display: flex; gap: 12px; align-items: flex-start; }
  .with-thumb > .info { flex: 1; min-width: 0; }
  .thumb { width: 64px; height: 48px; flex: none; border-radius: 8px; object-fit: cover; background: var(--line); }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--deep); color: #fff; border-radius: var(--radius); padding: 14px 16px; }
  .stat .k { font-size: 12.5px; color: #c9d8e4; }
  .stat .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
  .stat.light { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .stat.light .k { color: var(--ink-2); }
  .stat.wide { grid-column: 1 / -1; }
  @media (min-width: 600px) { .stat.wide { grid-column: auto; } }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
  .row .k { color: var(--ink-2); }
  .row .v { font-weight: 600; text-align: right; }
  .callout { border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13.5px; margin-top: 12px; }
  .callout.warn { background: var(--warn-soft); color: var(--warn); }
  .callout.bad { background: var(--bad-soft); color: var(--bad); }
  .xlinks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

  /* ---------- local guides ---------- */
  input[type=date], input[type=text], textarea {
    width: 100%;
    height: 46px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    min-width: 0;
  }
  textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .gplan { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg); font-size: 14px; color: var(--ink-2); }
  .gplan a { font-size: 13.5px; white-space: nowrap; }
  .gcost { margin: 0; }
  .gcost div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .gcost div:last-child { border-bottom: 0; }
  .gcost dt { font-size: 14.5px; color: var(--ink-2); }
  .gcost dd { margin: 0; font-weight: 600; white-space: nowrap; }
  .glist { margin: 0; padding-left: 20px; }
  .glist li { margin: 8px 0; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
  .glist li::marker { color: var(--ink-3); font-weight: 600; }
  .op .xlinks { grid-template-columns: 1fr; gap: 8px; }
  .op .xlinks .btn { width: 100%; }
  @media (min-width: 560px) { .op .xlinks { grid-template-columns: 1.4fr 1fr; } }
  .gpartner { border-color: var(--line-strong); background: var(--sand); }
  .gpartner h2 { margin-top: 0; }
  .gpartner .en { font-size: 13px; color: var(--ink-3); margin: 10px 0 0; }
  .btn[disabled], .btn.off { opacity: 0.5; cursor: not-allowed; pointer-events: none; }



  /* ---------- day-of clock ---------- */
  .nowbar { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .nowbar .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; line-height: 1; }
  .nowbar .clock small { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .nowbar .msg { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); border-left: 1px solid var(--line); padding-left: 12px; }
  .nowbar .msg b { color: var(--ink); }
  .nowbar.live, .nowbar.live .clock { background: var(--deep); border-color: var(--deep); color: #fff; }
  .nowbar.live .clock small, .nowbar.live .msg { color: #c9d8e4; border-color: rgba(255, 255, 255, 0.2); }
  .nowbar.live .msg b { color: #fff; }
  .nowbar.late { background: var(--bad-soft); border-color: var(--bad-soft); }
  .nowbar[hidden], .nowbar:empty { display: none; }
  a.nowbar { color: var(--ink); text-decoration: none; }
  a.nowbar.live { color: #fff; }
  .nowbar.late .msg b { color: var(--bad); }

  /* ---------- phrases ---------- */
  .phrase-group { margin-top: 22px; }
  .phrase-group h2 { margin: 0 0 10px; }
  .phrases { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .phrase { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font: inherit; color: var(--ink); }
  .phrase:hover { border-color: var(--line-strong); }
  .phrase .tx { flex: 1; min-width: 0; }
  .phrase .id { display: block; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; overflow-wrap: anywhere; }
  .phrase .tr { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
  .phrase .big { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .numtable { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .numtable div { background: var(--surface); padding: 12px 14px; min-width: 0; }
  .numtable b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .numtable span { font-size: 13.5px; color: var(--ink-2); }
  dialog.showcard { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; border: 0; padding: 0; background: #fff; color: var(--ink); }
  dialog.showcard::backdrop { background: rgba(10, 20, 32, 0.6); }
  .showcard .wrap { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 72px 28px 40px; position: relative; }
  .showcard .say { font-size: clamp(42px, 12vw, 84px); font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .showcard .mean { margin-top: 18px; font-size: 17px; color: var(--ink-2); }
  .showcard .close { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .showcard .hint { position: absolute; top: 26px; left: 28px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  @media (min-width: 720px) {
    .phrases { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .numtable { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  /* ---------- share ---------- */
  .share-btn { display: flex; width: 100%; margin-top: 12px; }
  .share-head-btn { height: 36px; padding: 0 12px; font-size: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 14px; }
  .card-head h2 { margin: 0; }
  .share-intro { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
  .share-preview {
    margin: 0;
    padding: 14px 16px;
    max-height: 46vh;
    overflow: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font: 14px/1.55 inherit;
    font-family: inherit;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .share-actions .wide { grid-column: 1 / -1; }
  .share-status { min-height: 20px; margin-top: 10px; font-size: 13.5px; color: var(--ok); text-align: center; }
  .share-note { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); text-align: center; }
  @media (min-width: 720px) {
    dialog.sheet.share { max-width: 520px; margin: auto; border-radius: 18px; }
  }

  /* ---------- price check ---------- */
  .verdict { margin-top: 18px; border-radius: var(--radius-sm); padding: 14px; background: var(--bg); }
  .verdict .head { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .verdict.ok { background: var(--ok-soft); } .verdict.ok .head { color: var(--ok); }
  .verdict.warn { background: var(--warn-soft); } .verdict.warn .head { color: var(--warn); }
  .verdict.bad { background: var(--bad-soft); } .verdict.bad .head { color: var(--bad); }
  .scale { position: relative; height: 10px; background: #fff; border: 1px solid var(--line); border-radius: 999px; margin: 14px 0 6px; }
  .scale .band { position: absolute; top: -1px; bottom: -1px; background: #b9d0e2; border-radius: 999px; }
  .scale .marker { position: absolute; top: -6px; width: 4px; height: 20px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list > li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .list > li:first-child { padding-top: 0; }
  .list > li:last-child { border-bottom: 0; padding-bottom: 0; }
  .list .line { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .list .name { font-weight: 500; }
  .list .value { text-align: right; font-weight: 650; white-space: nowrap; }
  .strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 16px; }
  .strip.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .shot { margin: 0; min-width: 0; }
  .shot img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius-sm); background: var(--line); }
  .shot figcaption { margin-top: 5px; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }

  /* banner photo for sections */
  .banner { position: relative; margin: 0 0 18px; border-radius: var(--radius); overflow: hidden; background: var(--deep); }
  .banner img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 7; object-fit: cover; }
  .banner figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 8px 12px; font-size: 12px; color: #d3dee7; background: var(--deep); }
  .banner figcaption a { color: #d3dee7; text-decoration: underline; }

  /* ---------- money ---------- */
  .converter { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
  .converter .eq { padding-bottom: 12px; color: var(--ink-3); }
  .converter input { font-size: 20px; font-weight: 650; height: 54px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .note { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); }
  .note .idr { font-weight: 650; font-size: 14.5px; }
  .note .sgd { font-size: 13px; color: var(--ink-2); }
  .tips { list-style: none; margin: 0; padding: 0; counter-reset: tip; }
  .tips li { position: relative; padding: 12px 0 12px 36px; border-bottom: 1px solid var(--line); font-size: 14px; counter-increment: tip; }
  .tips li:first-child { padding-top: 0; }
  .tips li:first-child::before { top: 0; }
  .tips li:last-child { border-bottom: 0; padding-bottom: 0; }
  .tips li::before {
    content: counter(tip);
    position: absolute;
    left: 0;
    top: 12px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }

  /* ---------- ferry ---------- */
  .ferry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .ferry-head b { font-size: 17px; display: block; }
  .fare { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; text-align: right; line-height: 1.1; }
  .fare small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  .route { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); gap: 8px; align-items: center; background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; }
  .route .side .k { font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
  .route .side div:last-child { font-size: 13.5px; font-weight: 500; }
  .route .arrow { color: var(--ink-3); display: grid; place-items: center; }
  dl.spec { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 12px; font-size: 14px; }
  dl.spec dt { color: var(--ink-3); }
  dl.spec dd { margin: 0; }

  /* ---------- checklist ---------- */
  .progress-card { display: flex; align-items: center; gap: 16px; }
  .ring { width: 64px; height: 64px; flex: none; }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.25s; }
  .progress-card b { font-size: 17px; display: block; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .check:last-child { border-bottom: 0; padding-bottom: 0; }
  .check:first-child { padding-top: 0; }
  .check input {
    appearance: none;
    flex: none;
    width: 22px;
    height: 22px;
    margin: 0;
    border: 1.5px solid var(--line-strong);
    border-radius: 7px;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: #fff;
  }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after {
    content: "";
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .check input:checked + span .txt { color: var(--ink-3); text-decoration: line-through; }

  /* ---------- about ---------- */
  .credits ul { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); }
  .credits li { margin: 4px 0; }
  .credits a { color: var(--ink-2); text-decoration: underline; }
  .site-foot { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
  .foot-top { display: grid; gap: 20px; padding-bottom: 20px; }
  .foot-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--ink); letter-spacing: -0.01em; }
  .mark.sm { width: 26px; height: 26px; border-radius: 8px; }
  .foot-brand p { margin: 8px 0 0; max-width: 46ch; line-height: 1.55; color: var(--ink-2); }
  .foot-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 16px; align-content: start; }
  .foot-links a { color: var(--ink-2); padding: 4px 0; }
  .foot-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  @media (min-width: 760px) {
    .foot-top { grid-template-columns: 1.4fr 1fr; gap: 32px; }
  }
  .site-foot a { color: var(--ink-2); }

  /* ---------- bottom tab bar (mobile) ---------- */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar a, .tabbar button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 0 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-3);
    min-width: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .tabbar a:hover { text-decoration: none; }
  .tabbar .active { color: var(--accent); font-weight: 600; }

  @media (min-width: 600px) {
    .strip.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tools { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .rail-scroll { grid-auto-columns: 40%; }
    .notes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (min-width: 768px) {
    .tabbar { display: none; }
    .topnav { display: flex; }
    .lang { margin-left: 8px; }
    .brand-sub { display: none; }
    main { padding: 8px 24px 48px; }
    .home-hero { margin: 16px 0 0; border-radius: 20px; min-height: 480px; }
    .home-hero .inner { padding: 40px 40px 32px; }
    .home-hero h1 { font-size: 64px; }
    .home-hero p { font-size: 17px; }
    h1 { font-size: 46px; }
    .eyebrow { margin-top: 32px; }
    .filters { grid-template-columns: 1fr 220px; align-items: center; }
    .seg { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
    .rail-scroll { margin: 0; padding: 2px 0 10px; grid-auto-columns: calc((100% - 36px) / 4); }
    dialog.sheet { margin: auto; max-width: 560px; border-radius: 18px; }
    .plan-layout { grid-template-columns: 360px minmax(0, 1fr); }
    .plan-layout .card.form { position: sticky; top: 72px; }

let lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("bus_lang") || "en";
const t = (key) => T[lang][key] ?? key;
const tf = (key, ...args) => T[lang][key](...args);
const pick = (obj) => obj[lang] ?? obj.en ?? "";
const fmtIdr = (n) => "Rp " + Math.round(n).toLocaleString("en-US");
const fmtSgd = (n) => "S$" + (Math.round(n * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 0 });
const pill = () => `<span class="pill">${t("unverified")}</span>`;
const icon = (id, cls) => `<svg class="ico ${cls || ""}" aria-hidden="true"><use href="#${id}"/></svg>`;
const ext = (url, label) => `<a href="${url}" target="_blank" rel="noopener">${label}${icon("i-ext", "xs")}</a>`;

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  if (lang === "zh") {
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

function getRate() {
  return Number(localStorage.getItem("bus_rate")) || DATA.rules.fx_mid_market_sgd_idr;
}

function toSgd(amount, currency) {
  return currency === "SGD" ? amount : amount / getRate();
}

function el(html) {
  const holder = document.createElement("div");
  holder.innerHTML = html.trim();
  return holder.firstElementChild;
}

function uncleNote(html) {
  return `<div class="uncle"><span class="badge" aria-hidden="true">U</span><div><b>${t("uncleSays")}</b>${html}</div></div>`;
}

/* ---------- navigation + language ---------- */
function currentId() {
  const id = (location.hash || "#home").slice(1);
  return SECTIONS.some((s) => s.id === id) ? id : "home";

function markActiveTab() {
  const id = currentId();
  document.querySelectorAll("main > section").forEach((s) => s.classList.toggle("active", s.id === "s-" + id));
  document.querySelectorAll("[data-tab]").forEach((a) => {
    const active = a.dataset.tab === id;
    a.classList.toggle("active", active);
    if (active) {
      a.setAttribute("aria-current", "page");
    } else {
      a.removeAttribute("aria-current");
    }
  });
  const moreBtn = document.getElementById("moreBtn");
  if (moreBtn) moreBtn.classList.toggle("active", MORE.includes(id));
}

/* ---------- planner ---------- */
const TERMINALS = {
  "Batam Centre": ["Batam Centre", "Nagoya", "Bengkong", "Harbour Bay"],
  "Harbour Bay": ["Harbour Bay", "Nagoya", "Bengkong", "Batam Centre"],
  "Sekupang": ["Sekupang", "Waterfront City", "Nagoya", "Harbour Bay"],
  "Nongsa Pura": ["Nongsa", "Batam Centre", "Nagoya"],
  "Waterfront City": ["Waterfront City", "Sekupang", "Nagoya", "Harbour Bay"],
};
const INTERESTS = ["spa", "shop", "sights", "seafood"];
const selectedInterests = new Set(["spa", "seafood"]);
const isSeafood = (p) => p.category === "eat" && (p.name.toLowerCase().includes("seafood") || p.id === "golden-prawn-933");

function priceRangeSgd(id) {
  const item = DATA.prices.find((p) => p.id === id);
  return { low: toSgd(item.low, item.currency), high: toSgd(item.high, item.currency) };
}

function nearestPlace(matches, terminal, avoidIds) {
  const order = TERMINALS[terminal];
  const rank = (area) => (order.indexOf(area) === -1 ? 99 : order.indexOf(area));
  return DATA.places
    .filter((p) => matches(p) && !avoidIds.has(p.id))
    .sort((a, b) => rank(a.area) - rank(b.area))[0];
}

const minutes = (value) => {
  const [h, m] = value.split(":").map(Number);
  return h * 60 + m;
};
const hhmm = (total) => String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");

function buildPlan() {
  const terminal = document.getElementById("terminal").value;
  const arrive = minutes(document.getElementById("arrive").value);
  const ferryBack = minutes(document.getElementById("returnFerry").value);
  const buffer = Number(document.getElementById("crowd").value);
  const grabLeg = 30;
  const mustLeaveAt = ferryBack - buffer - grabLeg;
  const out = document.getElementById("planOut");

  if (mustLeaveAt - arrive < 90) {
    out.innerHTML = `<div class="callout bad" style="margin-top:0">${t("noTime")}</div>`;
    lastPlan = null;
    return;
  }

  const steps = [{ at: arrive, title: t("arriveStep"), detail: terminal, key: true }];
  const skipped = [];
  const used = new Set();
  const cost = { low: 0, high: 0 };
  const addCost = (range) => {
    cost.low += range.low;
    cost.high += range.high;
  };
  let clock = arrive + 30;
  let grabRides = 1;
  let planned = 0;

  const activities = [{ kind: "lunch", minutes: 60 }];
  if (selectedInterests.has("sights")) activities.push({ kind: "sights", minutes: 150 });
  if (selectedInterests.has("shop")) activities.push({ kind: "shop", minutes: 90 });
  if (selectedInterests.has("spa")) activities.push({ kind: "spa", minutes: 120 });
  if (selectedInterests.has("seafood")) activities.push({ kind: "seafood", minutes: 90 });

  for (const act of activities) {
    const label = act.kind === "lunch" ? t("lunch") : t("i_" + act.kind);
    if (clock + act.minutes > mustLeaveAt) {
      skipped.push(label);
      continue;
    }
    let place = null;
    if (act.kind === "lunch") {
      place = nearestPlace((p) => p.category === "eat" && !isSeafood(p), terminal, used);
      addCost(priceRangeSgd("local-meal"));
    } else if (act.kind === "sights") {
      place = DATA.places.find((p) => p.id === "barelang-bridge");
    } else if (act.kind === "shop") {
      place = nearestPlace((p) => p.category === "shop", terminal, used);
    } else if (act.kind === "spa") {
      place = nearestPlace((p) => p.category === "spa", terminal, used);
      addCost(priceRangeSgd("massage"));
    } else if (act.kind === "seafood") {
      place = nearestPlace(isSeafood, terminal, used);
      addCost(priceRangeSgd("seafood"));
      const latestStart = mustLeaveAt - act.minutes;
      if (latestStart - clock >= 45) {
        steps.push({ at: clock, title: t("freeTime"), detail: "" });
      }
      clock = Math.max(clock, latestStart);
    }
    if (place) used.add(place.id);
    steps.push({ at: clock, title: label, detail: place ? `${place.name} · ${place.area}` : "", place });
    clock += act.minutes + 20;
    grabRides += 1;
    planned += 1;
  }

  const ferryFare = minFare();
  addCost({ low: ferryFare, high: ferryFare });
  const grab = priceRangeSgd("grab-bc-nagoya");
  addCost({ low: grab.low * grabRides, high: grab.high * grabRides });

  steps.push({ at: mustLeaveAt, title: t("leave"), detail: terminal });
  steps.push({ at: ferryBack - buffer, title: t("atTerminal"), detail: "" });
  steps.push({ at: ferryBack, title: t("ferryBack"), detail: "", key: true });

  lastPlan = { terminal, arrive, ferryBack, buffer, mustLeaveAt, steps, cost, skipped };
  if (planBooted) localStorage.setItem("bus_plan", new URLSearchParams({
    t: terminal,
    a: hhmm(arrive),
    r: hhmm(ferryBack),
    q: String(buffer),
    i: [...selectedInterests].join(","),
  }).toString());

  const rows = steps.map((s) => {
    const thumbKey = s.place && PLACE_PHOTOS[s.place.id];
    return `
    <li class="step${s.key ? " key" : ""}">
      <div class="time num">${hhmm(s.at)}</div>
      <div class="rail"></div>
      <div class="body${thumbKey ? " with-thumb" : ""}">
        <div class="info">
          <div class="title">${s.title}</div>
          ${s.detail ? `<div class="small">${s.detail}</div>` : ""}
          ${s.place ? `<div style="margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill()}<button type="button" class="linkbtn" data-place="${s.place.id}">${t("details")}</button></div>` : ""}
        </div>
        ${thumbKey ? photoImg(thumbKey, "thumb") : ""}
      </div>
    </li>`;
  }).join("");

  out.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">${t("leaveBy")}</div><div class="v num">${hhmm(mustLeaveAt)}</div></div>
      <div class="stat light"><div class="k">${t("activities")}</div><div class="v num">${planned}</div></div>
      <div class="stat light wide"><div class="k">${t("estCost")}</div><div class="v num">S$${Math.round(cost.low)}–${Math.round(cost.high)}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>${t("itinerary")}</h2><button type="button" class="btn ghost share-head-btn" data-share="plan">${icon("i-share", "sm")}${t("share")}</button></div>
      <ol class="timeline">${rows}</ol>
      <p class="meta" style="margin:4px 0 0">${t("estCostNote")}. ${t("tzNote")}</p>
      ${skipped.length ? `<div class="callout warn">${t("skipped")} ${skipped.join(", ")}</div>` : ""}
    </div>
    <button type="button" class="btn share-btn" data-share="plan">${icon("i-chat", "sm")}${t("sharePlan")}</button>
    <div class="xlinks">
      <a class="btn ghost" href="#ferry">${icon("i-ferry", "sm")}${t("seeFerries")}</a>
      <a class="btn ghost" href="#price">${icon("i-price", "sm")}${t("seePrices")}</a>
    </div>
    ${GUIDES_ON ? `<a class="btn ghost block" href="#guide" style="margin-top:10px">${icon("i-shield", "sm")}${t("g_ctaBtn")}</a>` : ""}
    <p class="meta" style="margin:10px 2px 0">${t("savedPlan")}</p>
    ${TIP_URL ? `<p class="meta" style="margin:6px 2px 0"><a href="${TIP_URL}" target="_blank" rel="noopener">${t("tip_line")}</a></p>` : ""}`;
  updateNowBar();
  if (document.getElementById("phraseList")) renderTalk();
  const guidePlan = document.getElementById("gPlan");
  if (guidePlan) guidePlan.textContent = guidePlanSummary();
}

function renderPlanForm() {
  const select = document.getElementById("terminal");
  const current = select.value;
  select.innerHTML = Object.keys(TERMINALS).map((name) => `<option>${name}</option>`).join("");
  if (current) select.value = current;

  const box = document.getElementById("interests");
  box.innerHTML = "";
  for (const key of INTERESTS) {
    const button = el(`<button type="button" class="toggle" aria-pressed="${selectedInterests.has(key)}">${t("i_" + key)}</button>`);
    button.onclick = () => {
      if (selectedInterests.has(key)) {
        selectedInterests.delete(key);
      } else {
        selectedInterests.add(key);
      }
      button.setAttribute("aria-pressed", selectedInterests.has(key));
      buildPlan();
    };
    box.appendChild(button);
  }
  buildPlan();
}

function checkPrice() {
  const item = DATA.prices.find((p) => p.id === document.getElementById("priceItem").value);
  const quoted = Number(document.getElementById("quoted").value);
  const currency = document.getElementById("quotedCur").value;
  const out = document.getElementById("verdict");
  if (item.low == null) {
    out.innerHTML = `<p class="meta" style="margin:12px 0 0">${t("noData")}</p>`;
    return;
  }
  if (!quoted) {
    out.innerHTML = "";
    return;
  }

  const q = toSgd(quoted, currency);
  const low = toSgd(item.low, item.currency);
  const high = toSgd(item.high, item.currency);
  let tone = "ok";
  let head = t("v_fair");
  if (q < low) {
    head = t("v_cheap");
  } else if (q > high * 1.3) {
    tone = "bad";
    head = t("v_bad");
  } else if (q > high) {
    tone = "warn";
    head = t("v_high");
  }

  const max = Math.max(high * 1.5, q * 1.1);
  const pct = (v) => Math.min(100, Math.max(0, (v / max) * 100)).toFixed(1);
  const quotedText = currency === "IDR" ? `${fmtIdr(quoted)} (${fmtSgd(q)})` : `${fmtSgd(quoted)} (${fmtIdr(quoted * getRate())})`;

  out.innerHTML = `
    <div class="verdict ${tone}" role="status">
      <div class="head">${head}</div>
      <div class="scale" aria-hidden="true">
        <div class="band" style="left:${pct(low)}%;width:${(pct(high) - pct(low)).toFixed(1)}%"></div>
        <div class="marker" style="left:${pct(q)}%"></div>
      </div>
      <div class="scale-labels num"><span>${fmtSgd(0)}</span><span>${fmtSgd(max)}</span></div>
      <div class="row num"><span class="k">${t("quotedLbl")}</span><span class="v">${quotedText}</span></div>
      <div class="row num"><span class="k">${t("typicalLbl")}</span><span class="v">${fmtSgd(low)} – ${fmtSgd(high)}</span></div>
    </div>`;
}

function convert(from) {
  const rate = Number(document.getElementById("rate").value) || getRate();

  if (from === "sgd") {
    idrInput.value = Math.round(Number(sgdInput.value) * rate);
  } else {
    sgdInput.value = (Number(idrInput.value) / rate).toFixed(2);
  }
  const sgd = Number(sgdInput.value) || 0;
  document.getElementById("terminalLoss").textContent = T[lang].lossNote(sgd, (sgd * 0.1).toFixed(0));

function renderChecklist() {

    progress.innerHTML = `

/* ---------- day-of clock ---------- */
function batamNowMinutes() {
  const override = new URLSearchParams(location.search).get("now");
  if (override && /^\d{2}:\d{2}$/.test(override)) return minutes(override);
  const now = new Date();
  return ((now.getUTCHours() + 7) % 24) * 60 + now.getUTCMinutes();
}

function fmtDuration(total) {
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (lang === "zh") return (h ? `${h} 小时 ` : "") + `${m} 分钟`;
  return (h ? `${h} h ` : "") + `${m} min`;
}

function updateNowBar() {
  const bar = document.getElementById("nowBar");
  if (!bar || !lastPlan) return;
  const now = batamNowMinutes();
  const plan = lastPlan;
  let state = "";
  let message;
  if (now < plan.arrive) {
    message = tf("nowBefore", hhmm(plan.arrive));
  } else if (now < plan.mustLeaveAt) {
    state = "live";
    message = tf("nowLeaveIn", fmtDuration(plan.mustLeaveAt - now));
  } else if (now < plan.ferryBack) {
    state = "late";
    message = now < plan.ferryBack - plan.buffer ? t("nowLeaveNow") : tf("nowFerryIn", fmtDuration(plan.ferryBack - now));
  } else {
    message = t("nowDone");
  }
  const html = `<div class="clock num"><small>${t("nowLabel")}</small>${hhmm(now)}</div>
    <div class="msg">${message}<div style="font-size:12.5px;margin-top:2px">${tf("sgNow", hhmm((now + 60) % 1440))}</div></div>`;
  bar.className = "nowbar " + state;
  bar.innerHTML = html;
  const homeBar = document.getElementById("homeNow");
  if (homeBar) {
    homeBar.hidden = !state;
    homeBar.className = "nowbar " + state;
    homeBar.innerHTML = html;
  }
}
setInterval(updateNowBar, 30000);

      detail = `${s.place.name} (${s.place.area})`;
    }
    return `${hhmm(s.at)}  ${s.title}${detail ? ": " + detail : ""}`;
  };
  const costRange = `S$${Math.round(plan.cost.low)}–${Math.round(plan.cost.high)}`;
  const parts = [
    t("sh_planHead"),
    tf("sh_trip", plan.terminal, hhmm(plan.arrive), hhmm(plan.ferryBack)),
    `(${t("sh_tz")})`,
    "",
    ...plan.steps.map(stepLine),
    "",
    tf("sh_leaveBy", hhmm(plan.mustLeaveAt)),
    tf("sh_cost", costRange),
  ];
  if (plan.skipped.length) {
    parts.push(tf("sh_skipped", plan.skipped.join(", ")));
  }
  parts.push("", t("sh_bring"), t("sh_unverified"));
  const link = planLink();
  if (link) {
    parts.push("", t("sh_open"), link);
  }
  parts.push("", t("sh_from"));
  return parts.join("\n");
}

function placeShareText(p) {
  const note = lang === "zh" ? (p.note_zh || p.note_en) : p.note_en;
  const mapUrl = "https://www.google.com/maps/search/" + encodeURIComponent(p.name + " Batam");
  const parts = [p.name, `${t(p.category)} · ${p.area}, Batam`];
  if (note) parts.push(note);
  parts.push("", t("sh_map"), mapUrl);
  const link = appLink({ place: p.id }, "#places");
  if (link) parts.push("", t("sh_openPlace"), link);
  parts.push("", t("sh_placeUnverified"), t("sh_from"));
  return parts.join("\n");
}

function guideShareText() {
  return [t("sh_guide"), appLink({}, "#home"), "", t("sh_from")].join("\n");
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (fallbackError) {
      ok = false;
    }
    area.remove();
    return ok;
  }
}

function openShare(title, text) {
  const sheet = document.getElementById("shareSheet");
  const canNativeShare = typeof navigator.share === "function";
  sheet.innerHTML = `
    <div class="sheet-head"><b id="shareSheetTitle"></b><button class="close" type="button" aria-label="${t("close")}">${icon("i-close", "sm")}</button></div>
    <div class="content" style="padding-top:8px">
      <p class="share-intro">${t("shareIntro")}</p>
      <pre class="share-preview" id="sharePreview"></pre>
      <div class="share-actions">
        <a class="btn${canNativeShare ? "" : " wide"}" id="shareWa" target="_blank" rel="noopener">${icon("i-chat", "sm")}${t("shareWa")}</a>
        ${canNativeShare ? `<button type="button" class="btn ghost" id="shareNative">${icon("i-share", "sm")}${t("shareMore")}</button>` : ""}
        <button type="button" class="btn ghost wide" id="shareCopy">${icon("i-copy", "sm")}${t("shareCopy")}</button>
      </div>
      <div class="share-status" id="shareStatus" role="status" aria-live="polite"></div>
      ${isHosted ? "" : `<p class="share-note">${t("shareNoLink")}</p>`}
    </div>`;
  sheet.querySelector("#shareSheetTitle").textContent = title;
  sheet.querySelector("#sharePreview").textContent = text;
  sheet.querySelector("#shareWa").href = "https://wa.me/?text=" + encodeURIComponent(text);
  const status = sheet.querySelector("#shareStatus");
  sheet.querySelector(".close").onclick = () => sheet.close();
  sheet.querySelector("#shareCopy").onclick = async () => {
    const ok = await copyText(text);
    status.style.color = ok ? "" : "var(--bad)";
    status.textContent = ok ? t("copied") : t("copyFail");
  };
  if (canNativeShare) {
    sheet.querySelector("#shareNative").onclick = () => {
      navigator.share({ title, text }).catch(() => {});
    };
  }
  const placeSheet = document.getElementById("placeSheet");
  if (placeSheet.open) placeSheet.close();
  sheet.showModal();
}

function sharePlan() {
  if (!lastPlan) buildPlan();
  if (!lastPlan) return;
  openShare(t("shareTitlePlan"), planShareText());
}

function sharePlace(id) {
  const p = DATA.places.find((x) => x.id === id);
  if (p) openShare(t("shareTitlePlace"), placeShareText(p));
}

function restoreSharedPlan(params) {
  const terminal = params.get("t");
  if (!terminal || !TERMINALS[terminal]) return false;
  const timePattern = /^\d{2}:\d{2}$/;
  document.getElementById("terminal").value = terminal;
  if (timePattern.test(params.get("a") || "")) document.getElementById("arrive").value = params.get("a");
  if (timePattern.test(params.get("r") || "")) document.getElementById("returnFerry").value = params.get("r");
  if (["60", "120"].includes(params.get("q"))) document.getElementById("crowd").value = params.get("q");
  if (params.has("i")) {
    selectedInterests.clear();
    params.get("i").split(",").filter((k) => INTERESTS.includes(k)).forEach((k) => selectedInterests.add(k));
  }
  renderPlanForm();
  return true;
}

function renderAll() {
  renderHome();
  renderPlanForm();
  renderPrices();
  renderMoney();
  renderFerry();
  renderChecklist();
  renderPlaces();
  renderTalk();

}

document.querySelectorAll(".lang button").forEach((button) => {

    lang = button.dataset.lang;
    localStorage.setItem("bus_lang", lang);
    applyLang();
    const verdict = document.getElementById("verdict");
    if (verdict.innerHTML.trim()) checkPrice();
  };
});
document.addEventListener("click", (event) => {
  const trigger = event.target.closest("[data-place]");
  if (trigger) {
    openPlace(trigger.dataset.place);
  }
  if (event.target.closest("[data-share=plan]")) {
    sharePlan();
  }
  const phraseButton = event.target.closest("[data-phrase]");
  if (phraseButton) {
    showPhrase(Number(phraseButton.dataset.phrase));
  }
  const placeShare = event.target.closest("[data-share-place]");
  if (placeShare) {
    sharePlace(placeShare.dataset.sharePlace);
  }
});
document.querySelectorAll("dialog.sheet").forEach((dialog) => {
  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) dialog.close();
  });
});
document.getElementById("planBtn").onclick = buildPlan;
["terminal", "arrive", "returnFerry", "crowd"].forEach((id) => {
  document.getElementById(id).addEventListener("change", buildPlan);
});
document.getElementById("checkBtn").onclick = checkPrice;
document.getElementById("rate").oninput = () => {
  localStorage.setItem("bus_rate", document.getElementById("rate").value);
  convert("sgd");
};
document.getElementById("sgd").oninput = () => convert("sgd");
document.getElementById("idr").oninput = () => convert("idr");
window.addEventListener("hashchange", showTab);

applyLang();
markActiveTab();

const sharedParams = new URLSearchParams(location.search);
if (!restoreSharedPlan(sharedParams)) {
  const savedPlan = localStorage.getItem("bus_plan");
  if (savedPlan) restoreSharedPlan(new URLSearchParams(savedPlan));
}
planBooted = true;
buildPlan();
if (isHosted && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (sharedParams.get("place")) openPlace(sharedParams.get("place"));
const shareGuideBtn = document.getElementById("shareGuideBtn");
shareGuideBtn.hidden = !isHosted;
shareGuideBtn.onclick = () => openShare(t("shareTitleGuide"), guideShareText());

// Demo hooks for screenshots: ?demo=price fills the price form, ?demo=place opens a place sheet.
const demo = new URLSearchParams(location.search).get("demo");
if (demo === "price") {
  document.getElementById("priceItem").value = "massage";
  document.getElementById("quoted").value = 650000;
  checkPrice();
}
